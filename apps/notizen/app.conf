kennung      = notizen
version      = 1.1
name         = Notizen
beschreibung = Eine Notizdatei mit dem Editor nano (Strg+O speichert, Strg+X beendet); liegt in den Dokumenten der App.
symbol       = N
farbe        = 5f7a3a
art          = terminal
start        = [ -f "$HOME/notizen.txt" ] && [ ! -e "$HOME/Dokumente/notizen.txt" ] && mkdir -p "$HOME/Dokumente" && mv "$HOME/notizen.txt" "$HOME/Dokumente/"; exec nano "$HOME/Dokumente/notizen.txt"
netzwerk     = nein
ram_max      = 64M
